<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KRISHNAS AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         APP
    ========================== -->

    <div class="app">

        <!-- HEADER -->
        <header class="header">

            <div class="brand">
                <div class="logo">K</div>

                <div>
                    <h1>KRISHNAS AI</h1>
                    <span>Intelligent Personal Assistant</span>
                </div>
            </div>

            <button class="menu-btn" id="menuBtn">
                ☰
            </button>

        </header>


        <!-- =========================
             MAIN
        ========================== -->

        <main class="main">

            <div class="hero">

                <div class="ai-orb">
                    <div class="orb-inner">
                        K
                    </div>
                </div>

                <p class="greeting">
                    Hello 👋
                </p>

                <h2>
                    What can I help you<br>
                    <span>with today?</span>
                </h2>

                <p class="description">
                    Ask Krishnas AI anything. Solve problems,
                    write code, understand images and much more.
                </p>

            </div>


            <!-- QUICK ACTIONS -->

            <section class="quick-actions">

                <button class="action-card">
                    <span class="icon">🧮</span>
                    <strong>Math</strong>
                    <small>Solve problems</small>
                </button>

                <button class="action-card">
                    <span class="icon">💻</span>
                    <strong>Code</strong>
                    <small>Build something</small>
                </button>

                <button class="action-card">
                    <span class="icon">👁️</span>
                    <strong>Vision</strong>
                    <small>Analyze images</small>
                </button>

                <button class="action-card">
                    <span class="icon">🌐</span>
                    <strong>Search</strong>
                    <small>Find information</small>
                </button>

            </section>


            <!-- CHAT AREA -->

            <section class="chat-area" id="chatArea">

                <!-- Messages will appear here -->

            </section>


            <!-- INPUT -->

            <div class="input-container">

                <button class="attach-btn" title="Attach">
                    +
                </button>

                <input
                    type="text"
                    id="userInput"
                    placeholder="Ask Krishnas AI anything..."
                    autocomplete="off"
                >

                <button class="voice-btn" id="voiceBtn">
                    🎙️
                </button>

                <button class="send-btn" id="sendBtn">
                    ➤
                </button>

            </div>

            <p class="disclaimer">
                KRISHNAS AI can make mistakes. Check important information.
            </p>

        </main>


        <!-- FOOTER -->

        <footer class="footer">
            <span>KRISHNAS AI</span>
            <span>•</span>
            <span>AI Assistant</span>
        </footer>

    </div>


    <script src="script.js"></script>

</body>
</html>
